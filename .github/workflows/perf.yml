name: perf-tests

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Escenario largo que se ejecutará de forma manual
        required: true
        default: stress
        type: choice
        options:
          - baseline
          - load
          - stress
          - spike
          - soak
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  pr-gates:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Empaquetar el servicio
        run: mvn -B -DskipTests clean package
        working-directory: registraduria

      - name: Levantar el servicio y esperar health
        run: |
          nohup java -jar target/registraduria-1.0-SNAPSHOT.jar > /tmp/app.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null; then
              echo "Servicio arriba"
              exit 0
            fi
            sleep 2
          done
          echo "El servicio no arrancó a tiempo"
          cat /tmp/app.log
          exit 1
        working-directory: registraduria

      - name: Instalar k6
        uses: grafana/setup-k6-action@v1

      - name: Preparar resultados
        run: mkdir -p perf/results

      - name: Baseline de rendimiento
        run: |
          k6 run \
            --env BASE_URL=http://localhost:8080 \
            --env SCENARIO=baseline \
            --env ID_BASE=0 \
            perf/scripts/register_person_k6.js

      - name: Baseline de resultado de negocio
        run: |
          k6 run \
            --env BASE_URL=http://localhost:8080 \
            --env SCENARIO=baseline \
            --env ID_BASE=700000000 \
            perf/scripts/register_voter_k6.js

      - name: Carga esperada
        run: |
          k6 run \
            --env BASE_URL=http://localhost:8080 \
            --env SCENARIO=load \
            --env ID_BASE=1000000000 \
            perf/scripts/register_person_k6.js

      - name: Publicar artefactos de Pull Request
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results-pr
          path: perf/results/summary-*.json
          if-no-files-found: warn

  manual-scenario:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Empaquetar el servicio
        run: mvn -B -DskipTests clean package
        working-directory: registraduria

      - name: Levantar el servicio y esperar health
        run: |
          nohup java -jar target/registraduria-1.0-SNAPSHOT.jar > /tmp/app.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null; then
              echo "Servicio arriba"
              exit 0
            fi
            sleep 2
          done
          echo "El servicio no arrancó a tiempo"
          cat /tmp/app.log
          exit 1
        working-directory: registraduria

      - name: Instalar k6
        uses: grafana/setup-k6-action@v1

      - name: Ejecutar escenario manual
        run: |
          k6 run \
            --env BASE_URL=http://localhost:8080 \
            --env SCENARIO=${{ inputs.scenario }} \
            --env ID_BASE=1200000000 \
            perf/scripts/register_person_k6.js

      - name: Publicar artefactos manuales
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results-${{ inputs.scenario }}
          path: perf/results/summary-*.json
          if-no-files-found: warn
